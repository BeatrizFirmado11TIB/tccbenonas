<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PETROTECH — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="login (1).css" />
<script src="theme (2).js"></script>
</head>
<body>

  <div class="app">

    <!-- ================= MENU (imagem 2) ================= -->
    <header class="navbar">
      <a href="#" class="logo">
        <span class="logo-badge">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5l8-3z"/>
          </svg>
        </span>
        <span class="logo-text">PETROTECH<i>.</i></span>
      </a>

      <nav class="nav-links">
        <a href="#">Início</a>
        <a href="#">Instruções</a>
        <a href="#">Produto</a>
        <a href="#">Quem somos</a>
        <a href="#">Referências</a>
        <a href="#">Jogo</a>
        <a href="#" class="active">Login</a>
      </nav>

      <button class="theme-btn" aria-label="Alternar tema">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </header>

    <!-- ================= CONTEÚDO ================= -->
    <main class="content">

      <!-- Lado esquerdo -->
      <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-inner">
          <p class="eyebrow">MONITORE. CONTROLE. PREVINA.</p>
          <h1 class="hero-title">
            Tenha o controle da sua<br />válvula em
            <span class="accent">tempo real</span>, onde estiver.
          </h1>
          <p class="hero-text">
            Faça login ao lado e tenha acesso ao monitoramento.
          </p>
        </div>
      </section>

      <!-- Lado direito - formulário -->
      <section class="form-side">
        <h2 class="form-title">Acesse<br />o aplicativo<span class="dot">.</span></h2>

        <form class="form">
          <div class="field">
            <div class="field-body">
              <label>Username</label>
              <input type="text" placeholder="Digite seu usuário..." id="nome" required>
            </div>
            <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg>
          </div>

          <div class="field field-focus">
            <div class="field-body">
              <label class="accent">Password</label>
              <input type="password" placeholder="Digite sua senha" id="nome" required>
            </div>
            <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 11a4 4 0 1 1 4-4 4 4 0 0 1-4 4zm0-6a2 2 0 1 0 2 2 2 2 0 0 0-2-2z"/></svg>
          </div>

          <p class="member">Não tem login? <a href="/frontend/pagges/cadastroo.html">Cadastre-se</a></p>

          <button type="submit" class="submit">Entrar</button>
        </form>
      </section>

    </main>
  </div>

</body>
</html>
